version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: kb-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=24h

  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: kb-anythingllm
    restart: unless-stopped
    ports:
      - "8301:3001"
    volumes:
      - ./data/anythingllm:/app/server/storage
    environment:
      - STORAGE_DIR=/app/server/storage
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_PATH=http://ollama:11434
      - OLLAMA_MODEL_PREF=${OLLAMA_MODEL:-qwen2.5:7b}
      - EMBEDDING_ENGINE=ollama
      - EMBEDDING_BASE_PATH=http://ollama:11434
      - EMBEDDING_MODEL_PREF=${EMBEDDING_MODEL:-bge-m3}
      - SERVER_NAME=智能知识库
      - LANGUAGE=zh-CN
      - DISABLE_TELEMETRY=true
    depends_on:
      - ollama

  kb-worker:
    image: python:3.11-slim
    container_name: kb-worker
    working_dir: /app
    restart: "no"
    volumes:
      - ./:/app
    environment:
      - ANYTHINGLLM_BASE_URL=http://anythingllm:3001
      - ANYTHINGLLM_API_KEY=${ANYTHINGLLM_API_KEY:-}
    command: >
      bash -c "pip install --no-cache-dir -r requirements.txt && apt-get update -qq && apt-get install -y -qq libreoffice-writer >/dev/null 2>&1 || true && python -m kb.cli init && tail -f /dev/null"
    depends_on:
      - anythingllm

  kb-web:
    image: python:3.11-slim
    container_name: kb-web
    working_dir: /app
    restart: unless-stopped
    ports:
      # 80 端口在很多机器上被占用，统一对外暴露 8081。
      # 修改后通过 http://localhost:8081 访问 kb-web。
      - "${KB_WEB_PORT:-8081}:8000"
    volumes:
      - ./:/app
    environment:
      - ANYTHINGLLM_BASE_URL=http://anythingllm:3001
      - ANYTHINGLLM_API_KEY=${ANYTHINGLLM_API_KEY:-}
      # 开发兜底：AnythingLLM 不可用时允许使用本地 users 表密码登录。
      # 生产交付前可改为 0。
      - KB_WEB_ALLOW_LOCAL_AUTH=${KB_WEB_ALLOW_LOCAL_AUTH:-1}
    command: >
      bash -c "pip install --no-cache-dir -r requirements.txt && python -m kb.web --host 0.0.0.0 --port 8000"
    depends_on:
      - kb-worker
      - anythingllm
