version: '3.8'

services:
  # ===== Ollama：本地LLM推理+向量嵌入（端口11434）=====
  ollama:
    image: ollama/ollama:latest
    container_name: kb-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ./volumes/ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_KEEP_ALIVE=24h
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      retries: 3

  # ===== LLM Wiki + 文档处理引擎 + 部门上传界面 =====
  llmwiki:
    image: python:3.11-slim
    container_name: kb-llmwiki
    working_dir: /app
    ports:
      - "8888:8888"
    volumes:
      - ./llmwiki:/app/config:ro
      - ./scripts:/app/scripts:ro
      - ./volumes/documents:/app/documents
      - ./volumes/llm-wiki-storage:/app/storage
      - ./volumes/llm-wiki-site:/app/site
      - ./volumes/users:/app/users
      - ./volumes/db:/app/storage/db
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-bge-m3}
      - OLLAMA_TIMEOUT=300
    command: >
      bash -c "
        pip install --no-cache-dir -q llmwiki pypdf python-docx pyyaml openpyxl requests &&
        apt-get update -qq && apt-get install -y -qq libreoffice-writer > /dev/null 2>&1 || true &&
        mkdir -p /app/storage/raw /app/storage/wiki /app/storage/db &&
        cp -f /app/config/config.yaml /app/ 2>/dev/null || true &&
        echo 'Starting upload server on :8888...' &&
        python3 /app/scripts/upload-server.py 8888
      "
    depends_on:
      ollama:
        condition: service_healthy

  # ===== AnythingLLM：RAG智能问答（端口8301）=====
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: kb-anythingllm
    restart: always
    ports:
      - "8301:3001"
    volumes:
      - ./volumes/anythingllm:/app/server/storage
      - ./volumes/llm-wiki-site:/app/server/documents/site:ro
      - ./volumes/documents:/app/server/documents/source:ro
    environment:
      - STORAGE_DIR=/app/server/storage
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_PATH=http://ollama:11434
      - OLLAMA_MODEL_PREF=${OLLAMA_MODEL:-qwen2.5:7b}
      - OLLAMA_MODEL_CONTEXT_WINDOW=8192
      - EMBEDDING_BASE_PATH=http://ollama:11434
      - EMBEDDING_ENGINE=ollama
      - EMBEDDING_MODEL_PREF=${EMBEDDING_MODEL:-bge-m3}
      - EMBEDDING_MODEL_MAX_CHUNK_LENGTH=4096
      - DEFAULT_TEMPERATURE=0.1
      - MAX_CHUNKS_PER_QUERY=8
      - AUTH_TOKEN=${ADMIN_PASSWORD:-admin123}
      - JWT_SECRET=${JWT_SECRET:-kb-secret-20250512}
      - DISABLE_TELEMETRY=true
      - SERVER_NAME=智能知识库
      - LANGUAGE=zh-CN
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001', r => process.exit(r.statusCode < 500 ? 0 : 1))\" || exit 1"]
      interval: 30s
      retries: 5
      start_period: 60s
    depends_on:
      ollama:
        condition: service_healthy

  # ===== Nginx：静态知识站点（端口80）=====
  nginx:
    image: nginx:alpine
    container_name: kb-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./volumes/llm-wiki-site:/usr/share/nginx/html:ro
      - ./volumes/documents:/usr/share/nginx/html/files:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      retries: 3
      start_period: 10s
