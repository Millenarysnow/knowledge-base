# ========== 智能知识库 - 统一配置 ==========

# LLM配置
llm:
  provider: ollama
  model: qwen2.5:7b
  base_url: http://ollama:11434
  temperature: 0.1
  max_tokens: 2048

# 向量嵌入配置
embedding:
  provider: ollama
  model: bge-m3
  base_url: http://ollama:11434

# ===== 统一分类字典（公共区和部门区共用）=====
# 支持通过配置自由增删分类
# dir:  存储目录名
# label: 前端显示名称
# keywords: AI/关键词分类依据
classification:
  auto_sort: true
  categories:
    - dir: 行政
      label: 行政制度
      keywords: [制度, 管理, 办法, 规定, 流程, 规范, 通知, 公告, 行政, 考勤, 薪酬, 人事, 财务, 审计, 合同]
    - dir: 技术
      label: 技术文档
      keywords: [架构, 接口, API, 代码, 部署, 数据库, 配置, 服务, 系统, 开发, SDK, 算法, 网络, 安全]
    - dir: 会议
      label: 会议纪要
      keywords: [会议, 纪要, 讨论, 决议, 复盘, 例会, 评审, 座谈, 研讨]
    - dir: 报告
      label: 工作报告
      keywords: [报告, 分析, 总结, 调研, 统计, 年度, 季度, 月度, 汇报, 评估]

# 知识图谱配置
knowledge_graph:
  enabled: true
  auto_cross_reference: true
  generate_backlinks: true

# 输出配置
output:
  storage_path: /app/storage
  site_path: /app/site
  template: default

# 文件组织
file_organization:
  date_based: true
  date_format: "%Y/%m/%d"
